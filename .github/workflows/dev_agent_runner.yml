name: Autonomous Dev Agent

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to execute task for'
        required: true
        type: string

jobs:
  execute-task:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'Ready for Dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Issue Metadata
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_ISSUE_NUM: ${{ github.event.issue.number }}
          INPUT_ISSUE_NUM: ${{ inputs.issue_number }}
        run: |
          if [ -n "$INPUT_ISSUE_NUM" ]; then
            ISSUE_NUM="$INPUT_ISSUE_NUM"
          else
            ISSUE_NUM="$EVENT_ISSUE_NUM"
          fi
          echo "ISSUE_NUM=$ISSUE_NUM" >> $GITHUB_OUTPUT

          ISSUE_DATA=$(gh issue view $ISSUE_NUM --json title,body)
          echo "TITLE=$(echo "$ISSUE_DATA" | jq -r .title)" >> $GITHUB_OUTPUT

      # Transition: Strip prior status -> In Progress
      - name: Transition Issue to In Progress
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ steps.metadata.outputs.ISSUE_NUM }}
        run: |
          gh issue edit $ISSUE_NUM --remove-label "Backlog" || true
          gh issue edit $ISSUE_NUM --remove-label "Ready for Dev" || true
          gh issue edit $ISSUE_NUM --remove-label "Needs Refinement" || true
          gh issue edit $ISSUE_NUM --add-label "In Progress"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install google-genai

      - name: Configure Git Identity
        run: |
          git config --global user.name "Autonomous Dev Agent"
          git config --global user.email "agent@github-actions.internal"

      - name: Run Dev Agent & Diff Guard
        id: agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_NUMBER: ${{ steps.metadata.outputs.ISSUE_NUM }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/dev_agent.py
        continue-on-error: true

      # Handle Circuit Breaker Trigger
      - name: Handle Circuit Breaker & Alerts
        if: steps.agent.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ steps.metadata.outputs.ISSUE_NUM }}
        run: |
          if [ -f alert_comment.md ]; then
            gh issue comment $ISSUE_NUM --body-file alert_comment.md
          else
            gh issue comment $ISSUE_NUM --body "❌ **Dev Agent Error**: Failed to process task. Check GitHub Action run logs."
          fi
          gh issue edit $ISSUE_NUM --remove-label "In Progress" --add-label "Needs Refinement"
          exit 1

      # Handle Success: Branch & PR Creation
      - name: Create Branch & Pull Request
        if: steps.agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ steps.metadata.outputs.ISSUE_NUM }}
          TITLE: ${{ steps.metadata.outputs.TITLE }}
        run: |
          BRANCH_NAME="agent/issue-${ISSUE_NUM}"
          git checkout -b $BRANCH_NAME
          git add .
          git commit -m "feat: implement issue #${ISSUE_NUM} - ${TITLE}"
          git push origin $BRANCH_NAME --force

          PR_URL=$(gh pr create \
            --title "feat: ${TITLE} (Closes #${ISSUE_NUM})" \
            --body "Automated implementation by Dev Agent for Issue #${ISSUE_NUM}. Includes SwiftUI/SwiftData code and accompanying unit tests. Ready for human review in Xcode." \
            --head $BRANCH_NAME \
            --base main)

          gh issue comment $ISSUE_NUM --body "✅ **Implementation Complete**: Pull Request created: $PR_URL with unit tests included."
          gh issue edit $ISSUE_NUM --remove-label "In Progress" --add-label "PR Open"
