name: Autonomous Dev Agent

on:
  issues:
    types: [labeled, opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to run dev agent on'
        required: true
        type: string

jobs:
  execute-task:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'Ready for Dev'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google GenAI SDK
        run: pip install google-genai

      - name: Configure Git
        run: |
          git config --global user.name "Gemini Dev Agent"
          git config --global user.email "agent@github-actions.internal"

      - name: Run Dev Agent & Diff Guard
        id: agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python .github/scripts/dev_agent.py
        continue-on-error: true

      # Handle Circuit Breaker Trigger
      - name: Handle Circuit Breaker Alert
        if: steps.agent.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          if [ -f alert_comment.md ]; then
            gh issue comment $ISSUE_NUM --body-file alert_comment.md
          else
            gh issue comment $ISSUE_NUM --body "❌ Dev Agent encountered an unexpected execution error. Check Action logs."
          fi
          gh issue edit $ISSUE_NUM --remove-label "Ready for Dev" --add-label "agent:Needs Refinement"
          exit 1

      # Create Pull Request if Successful
      - name: Create Branch & Pull Request
        if: steps.agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          BRANCH_NAME="agent/issue-${ISSUE_NUM}"
          git checkout -b $BRANCH_NAME
          git add .
          git commit -m "feat: implement issue #${ISSUE_NUM} - ${TITLE}"
          git push origin $BRANCH_NAME

          gh pr create \
            --title "feat: ${TITLE} (Closes #${ISSUE_NUM})" \
            --body "Automated implementation by Dev Agent for Issue #${ISSUE_NUM}. Includes SwiftUI/SwiftData changes and unit test suite. Please review diff and test in Xcode." \
            --head $BRANCH_NAME \
            --base main

          gh issue comment $ISSUE_NUM --body "✅ Pull Request created for this ticket with unit tests included. Ready for human review in Xcode."
          gh issue edit $ISSUE_NUM --remove-label "Ready for Dev" --add-label "agent:pr-open"
