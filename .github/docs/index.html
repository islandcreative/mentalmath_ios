<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iOS Dev Team — Agent Oversight Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bgDark: '#0f172a',
            cardDark: '#1e293b',
            accent: '#38bdf8'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-bgDark text-slate-100 min-h-screen font-sans p-6">

  <!-- Header & Configuration Bar -->
  <header class="flex flex-col md:flex-row justify-between items-start md:items-center pb-6 border-b border-slate-700 gap-4">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
        <span>🤖</span> Autonomous Dev Oversight Hub
      </h1>
      <p class="text-sm text-slate-400">SwiftUI & SwiftData Agentic Workflow</p>
    </div>

    <div class="flex items-center gap-3">
      <input id="ghToken" type="password" placeholder="GitHub Fine-grained PAT" 
             class="bg-slate-800 border border-slate-700 text-xs px-3 py-2 rounded-lg focus:outline-none focus:border-accent w-48 text-slate-200">
      <input id="ghRepo" type="text" placeholder="owner/repo" 
             class="bg-slate-800 border border-slate-700 text-xs px-3 py-2 rounded-lg focus:outline-none focus:border-accent w-36 text-slate-200">
      <button onclick="saveAndFetch()" class="bg-accent hover:bg-sky-400 text-slate-900 text-xs font-semibold px-4 py-2 rounded-lg transition">
        Sync Board
      </button>
    </div>
  </header>

  <!-- Metric Statistics Cards -->
  <section class="grid grid-cols-2 md:grid-cols-4 gap-4 my-6">
    <div class="bg-cardDark p-4 rounded-xl border border-slate-700/60 shadow-sm">
      <p class="text-xs uppercase text-slate-400 font-semibold">Total Issues</p>
      <h3 id="statTotal" class="text-2xl font-bold mt-1 text-white">0</h3>
    </div>
    <div class="bg-cardDark p-4 rounded-xl border border-slate-700/60 shadow-sm">
      <p class="text-xs uppercase text-amber-400 font-semibold">Ready For Dev</p>
      <h3 id="statReady" class="text-2xl font-bold mt-1 text-white">0</h3>
    </div>
    <div class="bg-cardDark p-4 rounded-xl border border-slate-700/60 shadow-sm">
      <p class="text-xs uppercase text-sky-400 font-semibold">PRs Open / Awaiting Test</p>
      <h3 id="statPRs" class="text-2xl font-bold mt-1 text-white">0</h3>
    </div>
    <div class="bg-cardDark p-4 rounded-xl border border-slate-700/60 shadow-sm">
      <p class="text-xs uppercase text-rose-400 font-semibold">Circuit Breaker Alerts</p>
      <h3 id="statAlerts" class="text-2xl font-bold mt-1 text-white">0</h3>
    </div>
  </section>

  <!-- Kanban Columns -->
  <main class="grid grid-cols-1 md:grid-cols-4 gap-6">
    <!-- Backlog -->
    <div class="bg-cardDark/50 rounded-xl p-4 border border-slate-800 flex flex-col">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Backlog</h2>
        <span id="badgeBacklog" class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">0</span>
      </div>
      <div id="colBacklog" class="space-y-3 flex-1 overflow-y-auto max-h-[600px]"></div>
    </div>

    <!-- Ready for Dev -->
    <div class="bg-cardDark/50 rounded-xl p-4 border border-slate-800 flex flex-col">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-amber-400">Ready for Dev</h2>
        <span id="badgeReady" class="text-xs px-2 py-0.5 rounded-full bg-amber-950/60 text-amber-400 border border-amber-800/40">0</span>
      </div>
      <div id="colReady" class="space-y-3 flex-1 overflow-y-auto max-h-[600px]"></div>
    </div>

    <!-- Agent Review / PR Open -->
    <div class="bg-cardDark/50 rounded-xl p-4 border border-slate-800 flex flex-col">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-sky-400">PR Open (Review)</h2>
        <span id="badgeReview" class="text-xs px-2 py-0.5 rounded-full bg-sky-950/60 text-sky-400 border border-sky-800/40">0</span>
      </div>
      <div id="colReview" class="space-y-3 flex-1 overflow-y-auto max-h-[600px]"></div>
    </div>

    <!-- Alerts / Paused -->
    <div class="bg-cardDark/50 rounded-xl p-4 border border-slate-800 flex flex-col">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-rose-400">Needs Refinement</h2>
        <span id="badgeAlerts" class="text-xs px-2 py-0.5 rounded-full bg-rose-950/60 text-rose-400 border border-rose-800/40">0</span>
      </div>
      <div id="colAlerts" class="space-y-3 flex-1 overflow-y-auto max-h-[600px]"></div>
    </div>
  </main>

  <script>
    // Initialize saved settings
    document.getElementById('ghToken').value = localStorage.getItem('hub_gh_token') || '';
    document.getElementById('ghRepo').value = localStorage.getItem('hub_gh_repo') || '';

    function saveAndFetch() {
      const token = document.getElementById('ghToken').value.trim();
      const repo = document.getElementById('ghRepo').value.trim();
      if (!token || !repo) return alert('Please enter both your GitHub PAT and owner/repo.');

      localStorage.setItem('hub_gh_token', token);
      localStorage.setItem('hub_gh_repo', repo);
      loadRepositoryData(token, repo);
    }

    async function loadRepositoryData(token, repo) {
      const headers = {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github.v3+json'
      };

      try {
        const issuesRes = await fetch(`https://api.github.com/repos/${repo}/issues?state=open&per_page=100`, { headers });
        const issues = await issuesRes.json();
        if (!Array.isArray(issues)) throw new Error(issues.message || 'Failed to fetch issues');

        renderBoard(issues);
      } catch (err) {
        alert('API Error: ' + err.message);
      }
    }

    function renderBoard(issues) {
      // Clear containers
      ['colBacklog', 'colReady', 'colReview', 'colAlerts'].forEach(id => document.getElementById(id).innerHTML = '');

      let counts = { backlog: 0, ready: 0, review: 0, alerts: 0 };

      issues.forEach(issue => {
        // Skip pull requests returned in issues endpoint
        if (issue.pull_request) return;

        const labels = issue.labels.map(l => l.name);
        let colId = 'colBacklog';

        if (labels.includes('agent:needs-refinement')) {
          colId = 'colAlerts';
          counts.alerts++;
        } else if (labels.includes('agent:pr-open')) {
          colId = 'colReview';
          counts.review++;
        } else if (labels.includes('ready-for-dev')) {
          colId = 'colReady';
          counts.ready++;
        } else {
          counts.backlog++;
        }

        const card = document.createElement('div');
        card.className = "bg-slate-800 p-3.5 rounded-lg border border-slate-700 hover:border-slate-600 transition shadow-sm";
        card.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <span class="text-xs font-mono text-slate-400">#${issue.number}</span>
            <span class="text-[10px] font-semibold uppercase px-2 py-0.5 rounded bg-slate-900 border border-slate-700 text-slate-300">
              ${labels.find(l => l.startsWith('size:')) || 'Task'}
            </span>
          </div>
          <h4 class="text-sm font-medium text-white mt-1.5 leading-snug">${issue.title}</h4>
          <div class="flex justify-between items-center mt-3 pt-2 border-t border-slate-700/60 text-xs text-slate-400">
            <span>${issue.comments} comments</span>
            <a href="${issue.html_url}" target="_blank" class="text-accent hover:underline">Inspect &rarr;</a>
          </div>
        `;
        document.getElementById(colId).appendChild(card);
      });

      // Update counters
      document.getElementById('statTotal').innerText = issues.length;
      document.getElementById('statReady').innerText = counts.ready;
      document.getElementById('statPRs').innerText = counts.review;
      document.getElementById('statAlerts').innerText = counts.alerts;

      document.getElementById('badgeBacklog').innerText = counts.backlog;
      document.getElementById('badgeReady').innerText = counts.ready;
      document.getElementById('badgeReview').innerText = counts.review;
      document.getElementById('badgeAlerts').innerText = counts.alerts;
    }

    // Auto-load if credentials are present
    if (localStorage.getItem('hub_gh_token') && localStorage.getItem('hub_gh_repo')) {
      loadRepositoryData(localStorage.getItem('hub_gh_token'), localStorage.getItem('hub_gh_repo'));
    }
  </script>
</body>
</html>
