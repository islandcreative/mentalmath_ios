<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Dev Oversight Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col">

  <!-- Top Navigation Bar -->
  <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 px-6 py-4 sticky top-0 z-20 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <span class="text-2xl">🤖</span>
      <div>
        <h1 class="text-base font-bold text-white leading-tight">iOS Dev Team Oversight Hub</h1>
        <p id="repoLabel" class="text-xs text-slate-400 font-mono">Not Connected</p>
      </div>
    </div>
    
    <div class="flex items-center gap-3">
      <button onclick="refreshData()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1.5 transition">
        <span>🔄</span> Refresh
      </button>
      <button onclick="openConfigModal()" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold text-xs px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5">
        <span>⚙️</span> Settings / PAT
      </button>
    </div>
  </header>

  <!-- Error / Status Notice Banner -->
  <div id="statusBanner" class="hidden px-6 py-2.5 text-xs font-medium border-b flex justify-between items-center">
    <span id="statusMessage"></span>
    <button onclick="dismissBanner()" class="text-slate-400 hover:text-white">&times;</button>
  </div>

  <div class="flex-1 p-6 max-w-7xl w-full mx-auto flex flex-col gap-6">

    <!-- KPI Metric Cards -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-sm">
        <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Backlog</span>
        <div id="statBacklog" class="text-2xl font-bold mt-1 text-slate-200">0</div>
      </div>
      <div class="bg-slate-900 border border-amber-900/40 p-4 rounded-xl shadow-sm">
        <span class="text-[11px] font-semibold text-amber-400 uppercase tracking-wider">Ready for Dev</span>
        <div id="statReady" class="text-2xl font-bold mt-1 text-amber-300">0</div>
      </div>
      <div class="bg-slate-900 border border-sky-900/40 p-4 rounded-xl shadow-sm">
        <span class="text-[11px] font-semibold text-sky-400 uppercase tracking-wider">PR Open (Review)</span>
        <div id="statReview" class="text-2xl font-bold mt-1 text-sky-300">0</div>
      </div>
      <div class="bg-slate-900 border border-rose-900/40 p-4 rounded-xl shadow-sm">
        <span class="text-[11px] font-semibold text-rose-400 uppercase tracking-wider">Needs Refinement</span>
        <div id="statAlerts" class="text-2xl font-bold mt-1 text-rose-400">0</div>
      </div>
    </section>

    <!-- Kanban Grid -->
    <main class="grid grid-cols-1 md:grid-cols-4 gap-4 flex-1 items-start">
      <!-- 1. Backlog -->
      <div class="bg-slate-900/60 rounded-xl border border-slate-800 flex flex-col p-4 min-h-[500px]">
        <div class="flex justify-between items-center pb-3 border-b border-slate-800 mb-3">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-slate-500"></span> Backlog
          </h2>
          <span id="countBacklog" class="text-xs font-mono text-slate-400 bg-slate-800 px-2 py-0.5 rounded-full">0</span>
        </div>
        <div id="colBacklog" class="flex flex-col gap-3 flex-1 overflow-y-auto"></div>
      </div>

      <!-- 2. Ready for Dev -->
      <div class="bg-slate-900/60 rounded-xl border border-amber-950/60 flex flex-col p-4 min-h-[500px]">
        <div class="flex justify-between items-center pb-3 border-b border-slate-800 mb-3">
          <h2 class="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-amber-400"></span> Ready for Dev
          </h2>
          <span id="countReady" class="text-xs font-mono text-amber-400 bg-amber-950/40 px-2 py-0.5 rounded-full border border-amber-900/40">0</span>
        </div>
        <div id="colReady" class="flex flex-col gap-3 flex-1 overflow-y-auto"></div>
      </div>

      <!-- 3. PR Open -->
      <div class="bg-slate-900/60 rounded-xl border border-sky-950/60 flex flex-col p-4 min-h-[500px]">
        <div class="flex justify-between items-center pb-3 border-b border-slate-800 mb-3">
          <h2 class="text-xs font-bold uppercase tracking-wider text-sky-400 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-sky-400"></span> PR Open
          </h2>
          <span id="countReview" class="text-xs font-mono text-sky-400 bg-sky-950/40 px-2 py-0.5 rounded-full border border-sky-900/40">0</span>
        </div>
        <div id="colReview" class="flex flex-col gap-3 flex-1 overflow-y-auto"></div>
      </div>

      <!-- 4. Alerts / Needs Refinement -->
      <div class="bg-slate-900/60 rounded-xl border border-rose-950/60 flex flex-col p-4 min-h-[500px]">
        <div class="flex justify-between items-center pb-3 border-b border-slate-800 mb-3">
          <h2 class="text-xs font-bold uppercase tracking-wider text-rose-400 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-rose-400"></span> Needs Refinement
          </h2>
          <span id="countAlerts" class="text-xs font-mono text-rose-400 bg-rose-950/40 px-2 py-0.5 rounded-full border border-rose-900/40">0</span>
        </div>
        <div id="colAlerts" class="flex flex-col gap-3 flex-1 overflow-y-auto"></div>
      </div>
    </main>
  </div>

  <!-- Settings / PAT Modal -->
  <div id="configModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-white">Dashboard Settings</h3>
        <button onclick="closeConfigModal()" class="text-slate-400 hover:text-white">&times;</button>
      </div>

      <div class="flex flex-col gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">GitHub Personal Access Token (PAT)</label>
          <input id="inputToken" type="password" placeholder="github_pat_..." class="w-full bg-slate-950 border border-slate-700 text-sm px-3.5 py-2.5 rounded-lg text-slate-200 focus:outline-none focus:border-sky-500">
          <p class="text-[11px] text-slate-400 mt-1">Requires <code>Issues: Read & Write</code> and <code>Pull requests: Read-only</code>.</p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Repository (owner/repo)</label>
          <input id="inputRepo" type="text" placeholder="example: yourusername/my-ios-app" class="w-full bg-slate-950 border border-slate-700 text-sm px-3.5 py-2.5 rounded-lg text-slate-200 focus:outline-none focus:border-sky-500">
        </div>

        <div class="pt-2 flex justify-end gap-2">
          <button onclick="closeConfigModal()" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white">Cancel</button>
          <button onclick="saveConfig()" class="bg-sky-500 hover:bg-sky-400 text-slate-950 px-4 py-2 rounded-lg text-xs font-bold transition">Save & Connect</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY_TOKEN = "hub_github_token";
    const STORAGE_KEY_REPO = "hub_github_repo";

    function showBanner(msg, type = "error") {
      const banner = document.getElementById("statusBanner");
      const messageEl = document.getElementById("statusMessage");
      banner.className = `px-6 py-2.5 text-xs font-medium border-b flex justify-between items-center ` + 
        (type === "error" ? "bg-rose-950/80 border-rose-900 text-rose-200" : "bg-emerald-950/80 border-emerald-900 text-emerald-200");
      messageEl.textContent = msg;
      banner.classList.remove("hidden");
    }

    function dismissBanner() {
      document.getElementById("statusBanner").classList.add("hidden");
    }

    function openConfigModal() {
      document.getElementById("inputToken").value = localStorage.getItem(STORAGE_KEY_TOKEN) || "";
      document.getElementById("inputRepo").value = localStorage.getItem(STORAGE_KEY_REPO) || "";
      document.getElementById("configModal").classList.remove("hidden");
    }

    function closeConfigModal() {
      document.getElementById("configModal").classList.add("hidden");
    }

    function saveConfig() {
      const token = document.getElementById("inputToken").value.trim();
      const repo = document.getElementById("inputRepo").value.trim();

      if (!token || !repo) {
        alert("Please enter both your PAT and repo path (owner/repo).");
        return;
      }

      localStorage.setItem(STORAGE_KEY_TOKEN, token);
      localStorage.setItem(STORAGE_KEY_REPO, repo);
      closeConfigModal();
      refreshData();
    }

    async function apiRequest(endpoint, options = {}) {
      const token = localStorage.getItem(STORAGE_KEY_TOKEN);
      const repo = localStorage.getItem(STORAGE_KEY_REPO);

      if (!token || !repo) {
        throw new Error("GitHub PAT or Repository not configured. Click 'Settings / PAT' above.");
      }

      const headers = {
        "Accept": "application/vnd.github.v3+json",
        "Authorization": `Bearer ${token}`
      };

      const res = await fetch(`https://api.github.com/repos/${repo}${endpoint}`, {
        ...options,
        headers: { ...headers, ...options.headers }
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.message || `GitHub API returned HTTP ${res.status}`);
      }

      return res.json();
    }

    async function promoteToDev(issueNumber) {
      try {
        await apiRequest(`/issues/${issueNumber}/labels`, {
          method: "POST",
          body: JSON.stringify({ labels: ["ready-for-dev"] })
        });
        showBanner(`Promoted #${issueNumber} to 'ready-for-dev'! Dev Agent will trigger shortly.`, "success");
        refreshData();
      } catch (err) {
        showBanner(`Failed to update issue: ${err.message}`, "error");
      }
    }

    async function refreshData() {
      dismissBanner();
      const repo = localStorage.getItem(STORAGE_KEY_REPO);
      const token = localStorage.getItem(STORAGE_KEY_TOKEN);

      if (!repo || !token) {
        openConfigModal();
        return;
      }

      document.getElementById("repoLabel").textContent = repo;

      try {
        const issues = await apiRequest(`/issues?state=open&per_page=100`);
        renderColumns(issues);
      } catch (err) {
        showBanner(err.message, "error");
      }
    }

    function renderColumns(items) {
      ["colBacklog", "colReady", "colReview", "colAlerts"].forEach(id => {
        document.getElementById(id).innerHTML = "";
      });

      let stats = { backlog: 0, ready: 0, review: 0, alerts: 0 };

      items.forEach(issue => {
        // Skip actual PR items that GitHub returns in /issues
        if (issue.pull_request) return;

        const labels = issue.labels.map(l => l.name);
        let col = "colBacklog";
        let isBacklog = false;

        if (labels.includes("agent:needs-refinement")) {
          col = "colAlerts";
          stats.alerts++;
        } else if (labels.includes("agent:pr-open")) {
          col = "colReview";
          stats.review++;
        } else if (labels.includes("ready-for-dev")) {
          col = "colReady";
          stats.ready++;
        } else {
          col = "colBacklog";
          isBacklog = true;
          stats.backlog++;
        }

        const sizeLabel = labels.find(l => l.toLowerCase().includes("small") || l.toLowerCase().includes("medium")) || "Task";

        const card = document.createElement("div");
        card.className = "bg-slate-900 border border-slate-800 p-3.5 rounded-lg shadow-sm hover:border-slate-700 transition flex flex-col gap-2";
        card.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="text-[11px] font-mono text-slate-400">#${issue.number}</span>
            <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-slate-950 border border-slate-800 text-slate-300">${sizeLabel}</span>
          </div>
          <h4 class="text-xs font-semibold text-slate-100 leading-snug line-clamp-2">${issue.title}</h4>
          <div class="flex justify-between items-center pt-2 border-t border-slate-800/80 text-[11px]">
            <a href="${issue.html_url}" target="_blank" class="text-sky-400 hover:underline">Open Issue &rarr;</a>
            ${isBacklog ? `
              <button onclick="promoteToDev(${issue.number})" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-900/60 px-2 py-0.5 rounded text-[10px] font-medium transition">
                Start Dev 🚀
              </button>
            ` : ""}
          </div>
        `;

        document.getElementById(col).appendChild(card);
      });

      // Update counter UI
      document.getElementById("statBacklog").textContent = stats.backlog;
      document.getElementById("statReady").textContent = stats.ready;
      document.getElementById("statReview").textContent = stats.review;
      document.getElementById("statAlerts").textContent = stats.alerts;

      document.getElementById("countBacklog").textContent = stats.backlog;
      document.getElementById("countReady").textContent = stats.ready;
      document.getElementById("countReview").textContent = stats.review;
      document.getElementById("countAlerts").textContent = stats.alerts;
    }

    // Auto load on start
    window.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem(STORAGE_KEY_TOKEN) && localStorage.getItem(STORAGE_KEY_REPO)) {
        refreshData();
      } else {
        openConfigModal();
      }
    });
  </script>
</body>
</html>
