<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iOS Dev Oversight Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
      padding: 24px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 24px;
    }
    .title-group h1 { font-size: 1.25rem; font-weight: 700; color: #fff; }
    .title-group p { font-size: 0.85rem; color: #94a3b8; font-family: monospace; }
    .btn-group { display: flex; gap: 10px; }
    button {
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      transition: all 0.2s ease;
    }
    .btn-primary { background: #38bdf8; color: #0b0f19; }
    .btn-primary:hover { background: #0ea5e9; }
    .btn-secondary { background: #1e293b; color: #f1f5f9; border: 1px solid #334155; }
    .btn-secondary:hover { background: #334155; }
    
    /* Banner */
    #statusBanner {
      display: none;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.85rem;
    }
    .banner-error { background: #450a0a; border: 1px solid #991b1b; color: #fca5a5; }
    .banner-success { background: #064e3b; border: 1px solid #065f46; color: #6ee7b7; }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: #111827;
      border: 1px solid #1f2937;
      padding: 16px;
      border-radius: 10px;
    }
    .stat-label { font-size: 0.75rem; text-transform: uppercase; color: #9ca3af; font-weight: 600; }
    .stat-val { font-size: 1.5rem; font-weight: 700; margin-top: 4px; color: #f9fafb; }

    /* Kanban Board */
    .kanban-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      align-items: start;
    }
    .column {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 10px;
      padding: 16px;
      min-height: 450px;
    }
    .col-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #1f2937;
      margin-bottom: 12px;
    }
    .col-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }
    .badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      background: #1f2937;
      color: #94a3b8;
    }
    .card-list { display: flex; flex-direction: column; gap: 12px; }
    .issue-card {
      background: #1a2234;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .issue-card h4 { font-size: 0.85rem; color: #fff; font-weight: 500; line-height: 1.4; }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      border-top: 1px solid #2d3748;
      padding-top: 8px;
      margin-top: 4px;
    }
    .card-meta a { color: #38bdf8; text-decoration: none; }
    .card-meta a:hover { text-decoration: underline; }
    .btn-start-dev {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid #b45309;
      color: #fbbf24;
      padding: 3px 8px;
      font-size: 0.7rem;
    }

    /* Native Modal Dialog */
    dialog {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      color: #fff;
      margin: auto;
      max-width: 440px;
      width: 90%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.75); }
    .modal-field { margin-bottom: 16px; }
    .modal-field label { display: block; font-size: 0.75rem; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; text-transform: uppercase; }
    .modal-field input {
      width: 100%;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .modal-field input:focus { border-color: #38bdf8; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <h1>🤖 Autonomous iOS Dev Oversight</h1>
      <p id="repoLabel">Repository: Not Connected</p>
    </div>
    <div class="btn-group">
      <button id="btnRefresh" class="btn-secondary">🔄 Refresh</button>
      <button id="btnOpenSettings" class="btn-primary">⚙️ Settings / PAT</button>
    </div>
  </header>

  <div id="statusBanner"></div>

  <!-- KPI Counters -->
  <section class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Backlog</div>
      <div class="stat-val" id="statBacklog">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label" style="color: #fbbf24;">Ready for Dev</div>
      <div class="stat-val" id="statReady" style="color: #fbbf24;">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label" style="color: #38bdf8;">PR Open (Review)</div>
      <div class="stat-val" id="statReview" style="color: #38bdf8;">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label" style="color: #f87171;">Needs Refinement</div>
      <div class="stat-val" id="statAlerts" style="color: #f87171;">0</div>
    </div>
  </section>

  <!-- Board Columns -->
  <main class="kanban-grid">
    <div class="column">
      <div class="col-header">
        <span class="col-title">Backlog</span>
        <span class="badge" id="countBacklog">0</span>
      </div>
      <div class="card-list" id="colBacklog"></div>
    </div>

    <div class="column" style="border-color: #78350f;">
      <div class="col-header">
        <span class="col-title" style="color: #fbbf24;">Ready for Dev</span>
        <span class="badge" id="countReady" style="color: #fbbf24;">0</span>
      </div>
      <div class="card-list" id="colReady"></div>
    </div>

    <div class="column" style="border-color: #0369a1;">
      <div class="col-header">
        <span class="col-title" style="color: #38bdf8;">PR Open</span>
        <span class="badge" id="countReview" style="color: #38bdf8;">0</span>
      </div>
      <div class="card-list" id="colReview"></div>
    </div>

    <div class="column" style="border-color: #991b1b;">
      <div class="col-header">
        <span class="col-title" style="color: #f87171;">Alerts / Paused</span>
        <span class="badge" id="countAlerts" style="color: #f87171;">0</span>
      </div>
      <div class="card-list" id="colAlerts"></div>
    </div>
  </main>

  <!-- HTML5 Native Modal -->
  <dialog id="settingsDialog">
    <h3 style="margin-bottom: 16px; font-size: 1.1rem;">Dashboard Settings</h3>
    
    <div class="modal-field">
      <label>GitHub Personal Access Token (PAT)</label>
      <input type="password" id="inputToken" placeholder="github_pat_...">
      <p style="font-size: 0.75rem; color: #94a3b8; margin-top: 4px;">Permissions: <code>Issues: Read & Write</code></p>
    </div>

    <div class="modal-field">
      <label>Repository (owner/repo)</label>
      <input type="text" id="inputRepo" placeholder="your-username/your-repo">
    </div>

    <div class="modal-actions">
      <button id="btnCancelSettings" class="btn-secondary">Cancel</button>
      <button id="btnSaveSettings" class="btn-primary">Save & Connect</button>
    </div>
  </dialog>

  <script>
    // Storage identifiers
    const KEY_PAT = "hub_gh_token";
    const KEY_REPO = "hub_gh_repo";

    const dialog = document.getElementById("settingsDialog");
    const inputToken = document.getElementById("inputToken");
    const inputRepo = document.getElementById("inputRepo");
    const statusBanner = document.getElementById("statusBanner");

    function showBanner(text, type = "error") {
      statusBanner.textContent = text;
      statusBanner.className = type === "error" ? "banner-error" : "banner-success";
      statusBanner.style.display = "block";
    }

    function hideBanner() {
      statusBanner.style.display = "none";
    }

    function openModal() {
      inputToken.value = localStorage.getItem(KEY_PAT) || "";
      inputRepo.value = localStorage.getItem(KEY_REPO) || "";
      dialog.showModal();
    }

    // Attach listeners cleanly
    document.getElementById("btnOpenSettings").addEventListener("click", openModal);
    document.getElementById("btnCancelSettings").addEventListener("click", () => dialog.close());
    document.getElementById("btnRefresh").addEventListener("click", loadDashboard);

    document.getElementById("btnSaveSettings").addEventListener("click", () => {
      const token = inputToken.value.trim();
      const repo = inputRepo.value.trim();

      if (!token || !repo) {
        alert("Please enter both the PAT and owner/repo path.");
        return;
      }

      localStorage.setItem(KEY_PAT, token);
      localStorage.setItem(KEY_REPO, repo);
      dialog.close();
      loadDashboard();
    });

    async function ghFetch(endpoint, options = {}) {
      const token = localStorage.getItem(KEY_PAT);
      const repo = localStorage.getItem(KEY_REPO);

      const headers = {
        "Accept": "application/vnd.github+json",
        "Authorization": `Bearer ${token}`
      };

      const res = await fetch(`https://api.github.com/repos/${repo}${endpoint}`, {
        ...options,
        headers: { ...headers, ...options.headers }
      });

      if (!res.ok) {
        const errorData = await res.json().catch(() => ({}));
        throw new Error(errorData.message || `API error (${res.status})`);
      }

      return res.json();
    }

    window.promoteToDev = async function(issueNum) {
      try {
        await ghFetch(`/issues/${issueNum}/labels`, {
          method: "POST",
          body: JSON.stringify({ labels: ["ready-for-dev"] })
        });
        showBanner(`Promoted #${issueNum} to 'ready-for-dev'! Dev Agent workflow triggered.`, "success");
        loadDashboard();
      } catch (err) {
        showBanner(`Failed to promote issue: ${err.message}`, "error");
      }
    };

    async function loadDashboard() {
      hideBanner();
      const token = localStorage.getItem(KEY_PAT);
      const repo = localStorage.getItem(KEY_REPO);

      if (!token || !repo) {
        openModal();
        return;
      }

      document.getElementById("repoLabel").textContent = `Repository: ${repo}`;

      try {
        const issues = await ghFetch(`/issues?state=open&per_page=100`);
        render(issues);
      } catch (err) {
        showBanner(`Connection Error: ${err.message}. Check your PAT and repo name.`, "error");
      }
    }

    function render(items) {
      ["colBacklog", "colReady", "colReview", "colAlerts"].forEach(id => {
        document.getElementById(id).innerHTML = "";
      });

      let stats = { backlog: 0, ready: 0, review: 0, alerts: 0 };

      items.forEach(issue => {
        if (issue.pull_request) return; // Skip PR objects

        const labels = (issue.labels || []).map(l => l.name);
        let colId = "colBacklog";
        let isBacklog = false;

        if (labels.includes("agent:needs-refinement")) {
          colId = "colAlerts";
          stats.alerts++;
        } else if (labels.includes("agent:pr-open")) {
          colId = "colReview";
          stats.review++;
        } else if (labels.includes("ready-for-dev")) {
          colId = "colReady";
          stats.ready++;
        } else {
          colId = "colBacklog";
          isBacklog = true;
          stats.backlog++;
        }

        const card = document.createElement("div");
        card.className = "issue-card";
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-family:monospace; color:#94a3b8; font-size:0.75rem;">#${issue.number}</span>
          </div>
          <h4>${issue.title}</h4>
          <div class="card-meta">
            <a href="${issue.html_url}" target="_blank">Open Issue &rarr;</a>
            ${isBacklog ? `<button class="btn-start-dev" onclick="window.promoteToDev(${issue.number})">Start Dev 🚀</button>` : ""}
          </div>
        `;

        document.getElementById(colId).appendChild(card);
      });

      document.getElementById("statBacklog").textContent = stats.backlog;
      document.getElementById("statReady").textContent = stats.ready;
      document.getElementById("statReview").textContent = stats.review;
      document.getElementById("statAlerts").textContent = stats.alerts;

      document.getElementById("countBacklog").textContent = stats.backlog;
      document.getElementById("countReady").textContent = stats.ready;
      document.getElementById("countReview").textContent = stats.review;
      document.getElementById("countAlerts").textContent = stats.alerts;
    }

    // Auto-check on boot
    window.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem(KEY_PAT) && localStorage.getItem(KEY_REPO)) {
        loadDashboard();
      } else {
        openModal();
      }
    });
  </script>
</body>
</html>
